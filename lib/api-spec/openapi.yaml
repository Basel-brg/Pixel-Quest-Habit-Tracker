openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pixel-quest
    description: Habit tracking, quests, and player progress
paths:
  /pixelquest/rpg:
    get:
      operationId: getRpgState
      tags: [pixel-quest]
      summary: Authoritative account-scoped RPG journal, settled in the player's timezone
      responses:
        "200":
          description: Current RPG state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpgSnapshot"
  /pixelquest/rpg/actions:
    post:
      operationId: performRpgAction
      tags: [pixel-quest]
      summary: Transactional, idempotent RPG action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpgActionInput"
      responses:
        "200":
          description: Updated state; repeated request IDs never repeat effects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpgSnapshot"
        "400":
          description: Invalid input
        "401":
          description: Sign in required
        "404":
          description: Owned resource not found
        "409":
          description: Action not currently eligible
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pixelquest/dashboard:
    get:
      operationId: getPixelQuestDashboard
      tags: [pixel-quest]
      summary: Get player progress and dashboard stats
      responses:
        "200":
          description: Player dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /pixelquest/profile:
    get:
      operationId: getPixelQuestProfile
      tags: [pixel-quest]
      summary: Get account profile and milestone history
      responses:
        "200":
          description: Player profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfileDetails"
    patch:
      operationId: updatePixelQuestProfile
      tags: [pixel-quest]
      summary: Update username or selected unlocked avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerProfileUpdate"
      responses:
        "200":
          description: Updated player profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfileDetails"
        "400":
          description: Invalid profile update
        "409":
          description: Username is taken or avatar is locked
  /pixelquest/habits:
    get:
      operationId: getHabits
      tags: [pixel-quest]
      summary: List habits and recent completion dates
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Habit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [pixel-quest]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
  /pixelquest/habits/{habitId}:
    patch:
      operationId: updateHabit
      tags: [pixel-quest]
      summary: Edit or archive a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Habit not found
  /pixelquest/habits/{habitId}/completions:
    put:
      operationId: completeHabit
      tags: [pixel-quest]
      summary: Mark a habit complete for a date
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionInput"
      responses:
        "200":
          description: Completion saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResult"
        "404":
          description: Habit not found
    delete:
      operationId: undoHabitCompletion
      tags: [pixel-quest]
      summary: Undo a habit completion
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCompletionUndoInput"
      responses:
        "204":
          description: Completion removed
        "404":
          description: Habit or completion not found
  /pixelquest/tasks:
    get:
      operationId: getTasks
      tags: [pixel-quest]
      summary: List and filter quest tasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed, all]
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
            enum: [easy, medium, hard]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestTask"
    post:
      operationId: createTask
      tags: [pixel-quest]
      summary: Create a quest task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestTask"
  /pixelquest/tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [pixel-quest]
      summary: Edit a quest task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestTask"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [pixel-quest]
      summary: Delete a quest task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /pixelquest/tasks/{taskId}/completion:
    put:
      operationId: completeTask
      tags: [pixel-quest]
      summary: Complete a quest task and earn XP
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResult"
        "404":
          description: Task not found
    delete:
      operationId: undoTaskCompletion
      tags: [pixel-quest]
      summary: Reopen a completed quest task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reopened task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestTask"
        "404":
          description: Task not found
  /pixelquest/achievements:
    get:
      operationId: getAchievements
      tags: [pixel-quest]
      summary: Get achievement progress
      responses:
        "200":
          description: Achievement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"
  /pixelquest/rewards:
    get:
      operationId: getRewards
      tags: [pixel-quest]
      summary: List reward shop items and their unlock progress
      responses:
        "200":
          description: Reward shop items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"
    post:
      operationId: createReward
      tags: [pixel-quest]
      summary: Add a real-life reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "400":
          description: Invalid reward or unlock condition
  /pixelquest/rewards/{rewardId}:
    patch:
      operationId: updateReward
      tags: [pixel-quest]
      summary: Edit an unclaimed reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardUpdate"
      responses:
        "200":
          description: Updated reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Reward not found
        "409":
          description: Claimed rewards cannot be edited
    delete:
      operationId: deleteReward
      tags: [pixel-quest]
      summary: Remove an unclaimed reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Reward deleted
        "404":
          description: Reward not found
        "409":
          description: Claimed rewards cannot be deleted
  /pixelquest/rewards/{rewardId}/claim:
    post:
      operationId: claimReward
      tags: [pixel-quest]
      summary: Claim an unlocked reward and archive it
      parameters:
        - name: rewardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claimed reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Reward not found
        "409":
          description: Reward is locked or already claimed
components:
  schemas:
    RpgCondition:
      type: object
      required: [type, target]
      properties:
        type: { type: string, enum: [level, streak, gold] }
        target: { type: integer, minimum: 1, maximum: 1000000 }
        habitId: { type: [integer, "null"] }
        current: { type: number }
        met: { type: boolean }
        label: { type: string }
    RpgDay:
      type: object
      required: [date, status, value, target]
      properties:
        date: { type: string }
        status: { type: string, enum: [complete, partial, missed, off, protected, upcoming] }
        value: { type: number }
        target: { type: number }
    RpgHabit:
      allOf:
        - $ref: "#/components/schemas/Habit"
        - type: object
          required: [mandatory, target, unit, stat, progress, streak, bestStreak, scheduledToday, history]
          properties:
            mandatory: { type: boolean }
            target: { type: number }
            unit: { type: string }
            stat: { type: string, enum: [STR, INT, WIS] }
            progress: { type: number }
            streak: { type: integer }
            bestStreak: { type: integer }
            scheduledToday: { type: boolean }
            history: { type: array, items: { $ref: "#/components/schemas/RpgDay" } }
    RpgQuest:
      allOf:
        - $ref: "#/components/schemas/QuestTask"
        - type: object
          required: [tags, type, xpReward, goldReward]
          properties:
            tags: { type: array, items: { type: string } }
            type: { type: string, enum: [single, weekly] }
            xpReward: { type: integer }
            goldReward: { type: integer }
    RpgReward:
      allOf:
        - $ref: "#/components/schemas/Reward"
        - type: object
          required: [conditions, claimCost, savingsTarget, savedAmount, savingsPerQuest]
          properties:
            conditions: { type: array, items: { $ref: "#/components/schemas/RpgCondition" } }
            claimCost: { type: integer }
            savingsTarget: { type: number }
            savedAmount: { type: number }
            savingsPerQuest: { type: number }
    RpgCatalogItem:
      type: object
      required: [id, name, description, price, requiredLevel, consumable]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: integer }
        requiredLevel: { type: integer }
        consumable: { type: boolean }
    RpgInventoryItem:
      type: object
      required: [id, catalogId, name, description, quantity, equipped, requiredLevel]
      properties:
        id: { type: string }
        catalogId: { type: string }
        name: { type: string }
        description: { type: string }
        quantity: { type: integer }
        equipped: { type: boolean }
        requiredLevel: { type: integer }
    RpgBoss:
      type: object
      required: [id, name, hp, maxHp, taskIds, defeated, bonusGold, loot]
      properties:
        id: { type: string }
        name: { type: string }
        hp: { type: integer }
        maxHp: { type: integer }
        taskIds: { type: array, items: { type: integer } }
        defeated: { type: boolean }
        bonusGold: { type: integer }
        loot: { type: string }
    RpgWeek:
      type: object
      required: [start, end, completionRate, completed, opportunities, xp, gold, habits]
      properties:
        start: { type: string }
        end: { type: string }
        completionRate: { type: number }
        completed: { type: integer }
        opportunities: { type: integer }
        xp: { type: integer }
        gold: { type: integer }
        habits:
          type: array
          items:
            $ref: "#/components/schemas/RpgHabitReport"
    RpgHabitReport:
      type: object
      required: [id, title, completed, opportunities, rate]
      properties:
        id: { type: integer }
        title: { type: string }
        completed: { type: integer }
        opportunities: { type: integer }
        rate: { type: number }
    RpgChest:
      type: object
      required: [enabled, eligible, opened, outcome, rewards, history]
      properties:
        enabled: { type: boolean }
        eligible: { type: boolean }
        opened: { type: boolean }
        outcome: { type: [string, "null"] }
        history:
          type: array
          items:
            $ref: "#/components/schemas/RpgChestEntry"
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/RpgChestPrize"
    RpgChestPrize:
      type: object
      required: [label, probability]
      properties:
        label: { type: string }
        probability: { type: number }
    RpgChestEntry:
      type: object
      required: [date, outcome]
      properties:
        date: { type: string }
        outcome: { type: string }
    RpgSnapshot:
      type: object
      required: [today, timezone, hp, faintedUntil, campingToday, stateSince, profile, skills, habits, quests, rewards, inventory, merchant, bosses, currentWeek, previousWeek, chest, rules, message, effect]
      properties:
        today: { type: string }
        timezone: { type: string }
        hp: { type: integer }
        faintedUntil: { type: [string, "null"] }
        campingToday: { type: boolean }
        stateSince: { type: string }
        profile: { $ref: "#/components/schemas/PlayerProfileDetails" }
        skills: { $ref: "#/components/schemas/RpgSkills" }
        habits: { type: array, items: { $ref: "#/components/schemas/RpgHabit" } }
        quests: { type: array, items: { $ref: "#/components/schemas/RpgQuest" } }
        rewards: { type: array, items: { $ref: "#/components/schemas/RpgReward" } }
        inventory: { type: array, items: { $ref: "#/components/schemas/RpgInventoryItem" } }
        merchant: { type: array, items: { $ref: "#/components/schemas/RpgCatalogItem" } }
        bosses: { type: array, items: { $ref: "#/components/schemas/RpgBoss" } }
        currentWeek: { $ref: "#/components/schemas/RpgWeek" }
        previousWeek: { $ref: "#/components/schemas/RpgWeek" }
        chest: { $ref: "#/components/schemas/RpgChest" }
        rules: { type: array, items: { type: string } }
        message: { type: string }
        effect: { type: string, enum: [none, complete, boss, reward] }
    RpgSkills:
      type: object
      required: [STR, INT, WIS]
      properties:
        STR: { type: integer }
        INT: { type: integer }
        WIS: { type: integer }
    RpgActionInput:
      type: object
      required: [requestId, action]
      properties:
        requestId: { type: string, minLength: 8, maxLength: 100 }
        action:
          type: string
          enum: [saveHabit, deleteHabit, progressHabit, saveQuest, deleteQuest, completeQuest, saveReward, deleteReward, claimReward, buyItem, updateItem, deleteItem, equipItem, consumeItem, settings, drawChest, savings, profile]
        id: { type: integer, minimum: 1 }
        itemId: { type: string, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 300 }
        category: { type: string, maxLength: 40 }
        frequency: { type: string, enum: [daily, weekly] }
        days: { type: array, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 } }
        archived: { type: boolean }
        mandatory: { type: boolean }
        target: { type: number, minimum: 1, maximum: 1000000 }
        unit: { type: string, maxLength: 30 }
        stat: { type: string, enum: [STR, INT, WIS] }
        value: { type: number, minimum: 0, maximum: 1000000 }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        difficulty: { type: string, enum: [easy, medium, hard] }
        priority: { type: boolean }
        dueDate: { type: [string, "null"] }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
        type: { type: string, enum: [single, weekly] }
        completed: { type: boolean }
        conditions: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/RpgCondition" } }
        claimCost: { type: integer, minimum: 0, maximum: 1000000 }
        savingsTarget: { type: number, minimum: 0, maximum: 100000000 }
        savedAmount: { type: number, minimum: 0, maximum: 100000000 }
        savingsPerQuest: { type: number, minimum: 0, maximum: 100000 }
        timezone: { type: string, maxLength: 100 }
        chestEnabled: { type: boolean }
        equipped: { type: boolean }
        username: { type: string, pattern: "^[A-Za-z0-9_]{3,20}$" }
        avatarId: { $ref: "#/components/schemas/AvatarId" }
        themeId: { $ref: "#/components/schemas/ThemeId" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Habit:
      type: object
      required: [id, title, category, frequency, days, archived, createdAt, completedDates]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        frequency: { type: string, enum: [daily, weekly] }
        days:
          type: array
          items: { type: integer }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedDates:
          type: array
          items: { type: string, format: date }
    HabitInput:
      type: object
      required: [title, category, frequency, days]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        frequency: { type: string, enum: [daily, weekly] }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
    HabitUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        frequency: { type: string, enum: [daily, weekly] }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        archived: { type: boolean }
    CompletionInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
    HabitCompletionUndoInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
    QuestTask:
      type: object
      required: [id, title, difficulty, category, priority, status, dueDate, createdAt, completedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        category: { type: string }
        priority: { type: boolean }
        status: { type: string, enum: [active, completed] }
        dueDate: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    TaskInput:
      type: object
      required: [title, difficulty, category, priority]
      properties:
        title: { type: string, minLength: 1 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        category: { type: string, minLength: 1 }
        priority: { type: boolean }
        dueDate: { type: [string, "null"], format: date }
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        category: { type: string, minLength: 1 }
        priority: { type: boolean }
        dueDate: { type: [string, "null"], format: date }
    PlayerProfile:
      type: object
      required: [xp, gold, level, xpIntoLevel, xpToNextLevel, streak, title]
      properties:
        xp: { type: integer }
        gold: { type: integer }
        level: { type: integer }
        xpIntoLevel: { type: integer }
        xpToNextLevel: { type: integer }
        streak: { type: integer }
        title: { type: string }
    AvatarId:
      type: string
      enum: [novice, squire, knight, paladin]
    AvatarOption:
      type: object
      required: [id, name, role, description, requiredLevel, unlocked]
      properties:
        id: { $ref: "#/components/schemas/AvatarId" }
        name: { type: string }
        role: { type: string }
        description: { type: string }
        requiredLevel: { type: integer }
        unlocked: { type: boolean }
    HabitStreakSummary:
      type: object
      required: [habitId, habitTitle, currentStreak, highestStreak]
      properties:
        habitId: { type: integer }
        habitTitle: { type: string }
        currentStreak: { type: integer }
        highestStreak: { type: integer }
    PlayerMilestone:
      type: object
      required: [id, title, description, achievedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        achievedAt: { type: string, format: date-time }
    PlayerProfileDetails:
      type: object
      required: [username, avatarId, selectedTheme, themeUpdatedAt, level, xp, gold, lifetimeTasksVanquished, highestHabitStreak, habitStreaks, avatars, milestones]
      properties:
        username: { type: string }
        avatarId: { $ref: "#/components/schemas/AvatarId" }
        selectedTheme: { $ref: "#/components/schemas/ThemeId" }
        themeUpdatedAt: { type: string, format: date-time }
        level: { type: integer }
        xp: { type: integer }
        gold: { type: integer }
        lifetimeTasksVanquished: { type: integer }
        highestHabitStreak: { type: integer }
        habitStreaks:
          type: array
          items: { $ref: "#/components/schemas/HabitStreakSummary" }
        avatars:
          type: array
          items: { $ref: "#/components/schemas/AvatarOption" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/PlayerMilestone" }
    PlayerProfileUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_]{3,20}$"
        avatarId: { $ref: "#/components/schemas/AvatarId" }
        themeId: { $ref: "#/components/schemas/ThemeId" }
    ThemeId:
      type: string
      enum: [retro, anime, cyberpunk, parchment, brutalist, cozy]
    Achievement:
      type: object
      required: [id, name, description, unlocked]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        unlocked: { type: boolean }
        unlockedAt: { type: [string, "null"], format: date-time }
    Dashboard:
      type: object
      required: [profile, completedTasks, activeHabits, completionRate, totalCompletions, recentActivity]
      properties:
        profile: { $ref: "#/components/schemas/PlayerProfile" }
        completedTasks: { type: integer }
        activeHabits: { type: integer }
        completionRate: { type: integer }
        totalCompletions: { type: integer }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    Activity:
      type: object
      required: [id, label, kind, happenedAt]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [habit, task] }
        happenedAt: { type: string, format: date-time }
    CompletionResult:
      type: object
      required: [xpEarned, profile, leveledUp, multiplier]
      properties:
        xpEarned: { type: integer }
        profile: { $ref: "#/components/schemas/PlayerProfile" }
        leveledUp: { type: boolean }
        multiplier: { type: number }
    RewardRuleType:
      type: string
      enum: [streak, gold, level]
    RewardStatus:
      type: string
      enum: [locked, ready, claimed]
    Reward:
      type: object
      required: [id, title, description, category, ruleType, target, habitId, habitTitle, currentValue, progressText, status, claimedAt, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        ruleType: { $ref: "#/components/schemas/RewardRuleType" }
        target: { type: integer }
        habitId: { type: ["integer", "null"] }
        habitTitle: { type: ["string", "null"] }
        currentValue: { type: integer }
        progressText: { type: string }
        status: { $ref: "#/components/schemas/RewardStatus" }
        claimedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RewardInput:
      type: object
      required: [title, description, category, ruleType, target, habitId]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 300 }
        category: { type: string, minLength: 1, maxLength: 40 }
        ruleType: { $ref: "#/components/schemas/RewardRuleType" }
        target: { type: integer, minimum: 1, maximum: 1000000 }
        habitId: { type: ["integer", "null"] }
    RewardUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 300 }
        category: { type: string, minLength: 1, maxLength: 40 }
        ruleType: { $ref: "#/components/schemas/RewardRuleType" }
        target: { type: integer, minimum: 1, maximum: 1000000 }
        habitId: { type: ["integer", "null"] }

