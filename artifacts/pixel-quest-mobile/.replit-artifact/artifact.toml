kind = "mobile"
previewPath = "/mobile/"
title = "Pixel Quest Mobile"
description = "A native iOS and Android companion for Pixel Quest. Track habits, complete quests, earn XP, and keep player progress synchronized with the web app."
version = "1.0.0"
id = "artifacts/pixel-quest-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18211

[services.development]
run = "pnpm --filter @workspace/pixel-quest-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixel-quest-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pixel-quest-mobile", "run", "serve" ]

[services.env]
PORT = "18211"
BASE_PATH = "/mobile/"
